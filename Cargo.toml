[package]
name = "rustub"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "2.0.21"
anyhow = "1.0.104"
axum = "0.8.9"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.34"
log = "0.4.34"
log4rs = "1"
walkdir = "2.5.0"
